name: Aggregate Concrete Docs

on:
  push:
    branches: [main]
    # The worker's own commit only touches paths in `paths-ignore`, so its push
    # cannot re-trigger this workflow. (The default GITHUB_TOKEN we push with
    # also doesn't trigger workflow runs by GitHub policy — this is the
    # belt-and-suspenders half of the loop guard.)
    paths-ignore:
      - 'docs.json'
      - 'public/**'
      - '_meta/**'
  schedule:
    - cron: '0 */6 * * *'
  # Source repos (FE/BE/SC) dispatch this event on a docs change. The
  # client_payload may carry fe_ref / be_ref / sc_ref to pin source branches.
  repository_dispatch:
    types: [docs-source-updated]
  workflow_dispatch:
    inputs:
      fe_ref:
        description: concrete-app ref to aggregate
        default: CONC-3564-update-knowledgebase
      be_ref:
        description: cb_backend ref to aggregate
        default: CONC-3564-mintlify-setup
      sc_ref:
        description: earn-v2-core ref to aggregate
        default: CONC-3564-mintlify

# TODO: once the source PRs merge, change the three input defaults above and
# the checkout fallbacks below back to `main`.

concurrency:
  group: aggregate-docs
  cancel-in-progress: true

env:
  STAGING_DIR: ${{ github.workspace }}/.staging
  OUTPUT_DIR: ${{ github.workspace }}/.output

jobs:
  aggregate:
    runs-on: ubuntu-latest
    name: Aggregate, preprocess, publish

    permissions:
      contents: write

    steps:
      - name: Checkout docs base
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      # The mintlify-multirepo-action does not support per-repo subdirectory
      # extraction, and its bundled merge step would clobber our preprocessor
      # output. Sparse-checkout each source repo into the staging tree so only
      # docs/business/ is pulled.
      - name: Stage frontend docs (concrete-app)
        uses: actions/checkout@v4
        with:
          repository: blueprint-finance/concrete-app
          ref: ${{ github.event.client_payload.fe_ref || inputs.fe_ref || 'CONC-3564-update-knowledgebase' }}
          token: ${{ secrets.DOCS_AGGREGATION_PAT }}
          path: .staging/frontend
          sparse-checkout: docs/business
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Stage backend docs (cb_backend)
        uses: actions/checkout@v4
        with:
          repository: blueprint-finance/cb_backend
          ref: ${{ github.event.client_payload.be_ref || inputs.be_ref || 'CONC-3564-mintlify-setup' }}
          token: ${{ secrets.DOCS_AGGREGATION_PAT }}
          path: .staging/backend
          sparse-checkout: docs/business
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Stage smart-contracts docs (earn-v2-core)
        uses: actions/checkout@v4
        with:
          repository: Blueprint-Finance/earn-v2-core
          ref: ${{ github.event.client_payload.sc_ref || inputs.sc_ref || 'CONC-3564-mintlify' }}
          token: ${{ secrets.DOCS_AGGREGATION_PAT }}
          path: .staging/smart-contracts
          sparse-checkout: docs/business
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install preprocessor deps
        working-directory: scripts
        run: npm ci

      # Seed the output tree with the base repo (everything that isn't tooling
      # or staging). The preprocessor then overlays generated content on top.
      - name: Seed output from base
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='.staging/' \
            --exclude='.output/' \
            --exclude='node_modules/' \
            ./ "$OUTPUT_DIR"/

      - name: Run Mintlify preprocessor
        env:
          STORYBLOK_PUBLIC: ${{ secrets.STORYBLOK_PUBLIC }}
          # Resolved earn-apy base URL incl. /v1. Unset ⇒ BE enrichment skipped.
          EARN_APY_API_URL: ${{ secrets.EARN_APY_API_URL }}
          STAGING_DIR: ${{ env.STAGING_DIR }}
          OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          BASE_DOCS_JSON: ${{ github.workspace }}/docs.json
        run: node scripts/preprocess-docs.mjs

      - name: Strip internal content (defense in depth)
        run: |
          set -euo pipefail
          find "$OUTPUT_DIR" -type d -name 'internal' -prune -exec rm -rf {} +

      - name: Upload aggregated output artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-docs
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 7

      - name: Publish aggregated tree to main
        run: |
          set -euo pipefail
          # Worker-owned paths — everything else on main is class-A content or
          # tooling and must not be overwritten by an aggregation run.
          # `concepts/` holds `emit: once` class-A earn rules written once by
          # the preprocessor; only present when at least one FE rule is marked.
          OWNED=(public _meta concepts docs.json)

          # Sync the local checkout to the latest main so the commit applies on
          # the current tip. Discards any local edits the workflow may have
          # made outside OWNED (there shouldn't be any).
          git fetch --quiet origin main
          git reset --hard origin/main

          # Re-merge docs.json against the just-reset main. The preprocessor
          # read its BASE_DOCS_JSON once at job start; anything landed on main
          # during this run (Mintlify editor pushes are paths-ignored on
          # docs.json so they don't re-trigger the worker) would otherwise be
          # clobbered by the stale class-A nav in the worker's output. This
          # rewrites OUTPUT_DIR/docs.json with class-A from fresh main + class-B
          # from the worker, before the rsync overlay copies it over.
          node scripts/merge-docs-json.mjs

          # Overlay the owned paths from the preprocessor output. --delete on
          # directory targets so removed vaults or themes don't leave stale
          # files behind in the published tree. An OWNED directory that the
          # current run did not produce (e.g. `concepts/` with no `emit: once`
          # files) is removed from main so a stale copy from a previous run
          # doesn't linger.
          for path in "${OWNED[@]}"; do
            src="$OUTPUT_DIR/$path"
            if [ -d "$src" ]; then
              mkdir -p "./$path"
              rsync -a --delete "$src/" "./$path/"
            elif [ -f "$src" ]; then
              cp "$src" "./$path"
            elif [ -d "./$path" ]; then
              rm -rf "./$path"
            fi
          done

          git config user.name  'concrete-docs-bot'
          git config user.email 'docs-bot@concrete.xyz'
          git add -- "${OWNED[@]}"
          if git diff --cached --quiet; then
            echo "No aggregated changes to publish."
            exit 0
          fi
          # actions/checkout cached the default GITHUB_TOKEN as the origin
          # credential — that token is contents:write (see job permissions)
          # and, by GitHub policy, its pushes do not trigger workflow runs.
          # Together with paths-ignore on this workflow's on:push, that closes
          # the worker→worker loop.
          git commit -q -m "docs: aggregate + preprocess @ ${GITHUB_SHA::7}"
          git push origin HEAD:main
